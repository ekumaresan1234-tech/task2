<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager Pro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen">
    <!-- Sidebar -->
    <div class="fixed left-0 top-0 h-full w-72 bg-gradient-to-b from-blue-600 to-blue-800 text-white shadow-2xl z-40 transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0">
        <div class="p-8">
            <div class="flex items-center mb-12 pb-8 border-b border-blue-400">
                <i class="fas fa-clipboard-list text-3xl mr-3"></i>
                <h1 class="text-2xl font-bold">Task Pro</h1>
            </div>
            <nav class="space-y-4">
                <a href="{% url 'tasks:task-list' %}" class="flex items-center p-4 rounded-xl hover:bg-blue-500/50 transition-all group">
                    <i class="fas fa-th-large w-6 mr-4 text-blue-200 group-hover:text-white transition-colors"></i>
                    Dashboard
                </a>
                <a href="{% url 'tasks:task-create' %}" class="flex items-center p-4 rounded-xl hover:bg-blue-500/50 transition-all group">
                    <i class="fas fa-plus w-6 mr-4 text-blue-200 group-hover:text-white transition-colors"></i>
                    New Task
                </a>
                <a href="/admin/" class="flex items-center p-4 rounded-xl hover:bg-blue-500/50 transition-all group">
                    <i class="fas fa-cogs w-6 mr-4 text-blue-200 group-hover:text-white transition-colors"></i>
                    Admin
                </a>
            </nav>
        </div>
    </div>

    <!-- Mobile toggle -->
    <button id="sidebar-toggle" class="lg:hidden fixed left-4 top-4 z-50 p-3 bg-white rounded-xl shadow-lg">
        <i class="fas fa-bars text-blue-600 text-xl"></i>
    </button>

    <!-- Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <!-- Main content -->
    <main class="ml-0 lg:ml-72 p-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-6 rounded-2xl bg-green-50 border border-green-200 text-green-800 max-w-2xl mx-auto animate-pulse">
                    <i class="fas fa-check-circle mr-3"></i>{{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                <div class="p-8 border-b border-slate-200 sticky top-0 bg-white z-10">
                    <div class="flex items-center justify-between">
                        <h2 id="modal-title" class="text-3xl font-bold text-slate-900">New Task</h2>
                        <button id="close-modal" class="p-3 hover:bg-slate-100 rounded-2xl transition-all">
                            <i class="fas fa-times text-2xl"></i>
                        </button>
                    </div>
                </div>
                <form id="task-form" class="p-8">
                    {% csrf_token %}
                    <input type="hidden" id="task-id" name="id">
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-lg font-bold text-slate-900 mb-3">Task Title <span class="text-red-500">*</span></label>
                            <input type="text" id="task-title" name="title" required class="w-full p-4 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-xl">
                        </div>
                        <div>
                            <label class="block text-lg font-bold text-slate-900 mb-3">Description</label>
                            <textarea id="task-description" name="description" rows="4" class="w-full p-4 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-lg font-bold text-slate-900 mb-3">Status</label>
                            <select id="task-status" name="status" class="w-full p-4 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex space-x-4 mt-12 pt-8 border-t">
                        <button type="button" id="cancel-btn" class="flex-1 p-4 border border-slate-300 hover:border-slate-400 rounded-2xl font-bold transition-colors">Cancel</button>
                        <button type="submit" id="submit-btn" class="flex-1 p-4 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-2xl font-bold shadow-lg hover:shadow-xl transition-all">
                            <span id="submit-text">Create Task</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sidebar toggle
        document.getElementById('sidebar-toggle').onclick = function() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        };
        
        document.getElementById('sidebar-overlay').onclick = function() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('hidden');
        };

        // Modal
        let editingId = null;
        
        document.getElementById('add-task-btn').onclick = function() {
            editingId = null;
            document.getElementById('modal-title').textContent = 'New Task';
            document.getElementById('task-id').value = '';
            document.getElementById('task-title').value = '';
            document.getElementById('task-description').value = '';
            document.getElementById('task-status').value = 'pending';
            document.getElementById('submit-text').textContent = 'Create Task';
            document.getElementById('task-modal').classList.remove('hidden');
        };

        document.getElementById('close-modal').onclick = closeModal;
        document.getElementById('cancel-btn').onclick = closeModal;
        document.getElementById('task-modal').onclick = function(e) {
            if (e.target.id === 'task-modal') closeModal();
        };

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        document.getElementById('task-form').onsubmit = function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const url = editingId ? `/tasks/ajax/update/${editingId}/` : '/tasks/ajax/create/';
            
            fetch(url, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert('Error: ' + data.error);
                }
            });
        };

        function editTask(id) {
            editingId = id;
            document.getElementById('modal-title').textContent = 'Edit Task';
            document.getElementById('task-id').value = id;
            document.getElementById('submit-text').textContent = 'Update Task';
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function deleteTask(id) {
            if (confirm('Delete this task?')) {
                fetch(`/tasks/ajax/delete/${id}/`, {method: 'POST'})
                .then(() => location.reload());
            }
        }

        function toggleStatus(id) {
            fetch(`/tasks/ajax/update/${id}/`, {
                method: 'POST',
                headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
                body: new FormData()
            }).then(() => location.reload());
        }
    </script>
</body>
</html>
